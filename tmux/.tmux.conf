# ============================================================================
# .tmux.conf — Ian's tmux configuration
# Managed by GNU stow from ~/dotfiles
# ============================================================================

# --- Prefix -----------------------------------------------------------------
# Use Ctrl+a instead of Ctrl+b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- General ----------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g history-limit 10000
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Key bindings -----------------------------------------------------------
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Split panes with | and -
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Project picker (C-a N)
bind N display-popup -E -w 60% -h 60% "$HOME/.local/bin/project-open"

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Status bar -------------------------------------------------------------
set -g status-position top
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[bg=#1e1e2e,fg=#89b4fa]"
set -g status-right "#[bg=#1e1e2e,fg=#313244]#[bg=#313244,fg=#cdd6f4] %H:%M %d-%b "

set -g window-status-format "#[bg=#1e1e2e,fg=#313244] #I:#W #[bg=#1e1e2e,fg=#313244]"
set -g window-status-current-format "#[bg=#1e1e2e,fg=#89b4fa]#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W #[bg=#1e1e2e,fg=#89b4fa]"
set -g window-status-separator ""

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
